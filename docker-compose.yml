services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: crm_html_app
    ports:
      - "8090:3010"
    volumes:
      - crm_html_data:/app/backend/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3010/api/auth/me"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  crm_html_data:
