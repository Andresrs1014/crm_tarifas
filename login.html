<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar — Grupo ZYMO</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#0a0e1a; font-family:'Barlow',Arial,sans-serif; color:#e2e8f0; }
  .box { background:#111827; border:1px solid #1e293b; border-radius:12px; padding:36px 32px; width:320px; }
  h1 { font-size:20px; margin:0 0 20px; color:#fff; }
  label { display:block; font-size:12px; color:#94a3b8; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px; }
  input { width:100%; box-sizing:border-box; background:#0a0e1a; border:1px solid #1e293b; color:#e2e8f0;
    border-radius:7px; padding:10px 12px; font-size:14px; margin-bottom:16px; }
  input:focus { outline:none; border-color:#00c2ff; }
  button { width:100%; background:#00c2ff; color:#001018; border:none; border-radius:7px; padding:11px;
    font-size:14px; font-weight:700; cursor:pointer; }
  button:disabled { opacity:0.5; cursor:not-allowed; }
  .err { color:#f87171; font-size:13px; margin:-8px 0 14px; min-height:16px; }
</style>
</head>
<body>
  <div class="box">
    <h1>Grupo ZYMO — Acceso</h1>
    <form id="loginForm">
      <label for="username">Usuario</label>
      <input type="text" id="username" autocomplete="username" autofocus>
      <label for="password">Contraseña</label>
      <input type="password" id="password" autocomplete="current-password">
      <div class="err" id="err"></div>
      <button type="submit" id="submitBtn">Ingresar</button>
    </form>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      var err = document.getElementById('err');
      var username = document.getElementById('username').value;
      var password = document.getElementById('password').value;
      btn.disabled = true;
      err.textContent = '';
      fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, password: password }),
      }).then(function (res) {
        if (!res.ok) throw new Error('bad-credentials');
        var params = new URLSearchParams(window.location.search);
        window.location.href = params.get('next') || '/';
      }).catch(function () {
        err.textContent = 'Usuario o contraseña incorrectos.';
        btn.disabled = false;
      });
    });
  </script>
</body>
</html>
